name: gohex

x-service-env: &service-env
  KAFKA_BROKERS: kafka:9092
  OTEL_EXPORTER_OTLP_ENDPOINT: http://hyperdx:4318

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: gohex
    volumes:
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "127.0.0.1:9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 30

  # HyperDX local (ClickStack): ClickHouse-backed traces/logs/metrics with
  # an OTLP collector built in. UI on host port 8090.
  hyperdx:
    image: clickhouse/clickstack-local:latest
    ports:
      - "127.0.0.1:8090:8080"  # UI
      - "127.0.0.1:4318:4318"  # OTLP/HTTP (for running services outside compose)

  ordering:
    build:
      context: .
      args: { SERVICE: ordering }
    environment:
      <<: *service-env
      DATABASE_URL: postgres://postgres:gohex@postgres:5432/ordering
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    restart: unless-stopped

  billing:
    build:
      context: .
      args: { SERVICE: billing }
    environment:
      <<: *service-env
      DATABASE_URL: postgres://postgres:gohex@postgres:5432/billing
      PORT: "8081"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    restart: unless-stopped

  inventory:
    build:
      context: .
      args: { SERVICE: inventory }
    environment:
      <<: *service-env
      DATABASE_URL: postgres://postgres:gohex@postgres:5432/inventory
      PORT: "8082"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    restart: unless-stopped

  shipping:
    build:
      context: .
      args: { SERVICE: shipping }
    environment:
      <<: *service-env
      DATABASE_URL: postgres://postgres:gohex@postgres:5432/shipping
      PORT: "8083"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    restart: unless-stopped
